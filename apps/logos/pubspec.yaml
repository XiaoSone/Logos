name: logos
description: Logos — 以话语为根基的圣经学习应用
publish_to: none
version: 0.1.0+2
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.39
  path_provider: ^2.1.5
  path: ^1.9.1
  graphql_flutter: ^5.2.1
  flutter_secure_storage: ^9.2.4
  cryptography: ^2.7.0
  uuid: ^4.5.1
  share_plus: ^11.0.0
  scrollable_positioned_list: ^0.3.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/bible_index.json
    - assets/bible.bin
