services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: logos
      POSTGRES_USER: logos
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logos -d logos"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-ttl"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis_data:/data
volumes:
  postgres_data:
  redis_data:
